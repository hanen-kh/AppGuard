spring.application.name=projetPFE
security.jwt.secret=${JWT_SECRET}
# Configuration de MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appguard?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081

# Configuration Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Configuration MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/log}

# Configuration logging
logging.level.org.springframework=INFO
logging.level.com.supervision=DEBUG


# Configuration Actuator pour le monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


#config de l email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

#config redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

spring.main.allow-bean-definition-overriding=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=metric-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#logging.level.org.springframework.kafka=DEBUG

spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.datasource.hikari.register-mbeans=true

#config Quartz
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
