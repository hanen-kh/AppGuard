
<style>
.sidebar {
  width: 240px;
  background: linear-gradient(to bottom, #01295c, #1e3a4d);
  color: white;
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  margin-bottom: 20px;
}

.profile-pic {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background-color: #fff;
  overflow: hidden;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid rgba(255, 255, 255, 0.3);
  
  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
}

.profile-name {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 5px;
}

.profile-email {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
}

.menu {
  flex: 1;
}

.menu-item {
  padding: 12px 25px;
  display: flex;
  align-items: center;
  color: rgba(255, 255, 255, 0.85);
  text-decoration: none;
  transition: all 0.3s;
  
  &:hover, &.active {
    background-color: rgba(255, 255, 255, 0.1);
    color: white;
  }
  
  i {
    margin-right: 15px;
    width: 20px;
    text-align: center;
  }
}

.logout {
  padding: 55px 25px;
  display: flex;
  align-items: center;
  color: rgba(255, 255, 255, 0.85);
  text-decoration: none;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  
  i {
    margin-right: 15px;
  }
}

</style>



<div class="sidebar">
    <div class="profile">
      <div class="profile-pic">
        <img [src]="user.profilePic" alt="Photo de profil">
      </div>
      <div class="profile-name">{{ user.name }}</div>
      <div class="profile-email">{{ user.email }}</div>
    </div>
    
    <div class="menu">
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.route" 
         [class.active]="item.active"
         (click)="setActive(item)"
         class="menu-item">
        <i class="fas {{ item.icon }}"></i> {{ item.label }}
      </a>
    </div>
    
    <a href="javascript:void(0)" class="logout" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i> Déconnexion
    </a>
  </div>
