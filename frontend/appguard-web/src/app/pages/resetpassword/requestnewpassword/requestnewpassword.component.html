<style>
    .modal {
      display: block; /* Affiché par défaut pour voir le rendu */
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
    }
  
    .modal-content {
      display: flex;
      width: 50%;
      height: 60%;
      margin: 5% auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
  
    /* Partie gauche avec logo (fond bleu) */
    .left-side {
      width: 50%;
      background-color: #020946;
      display: flex;
  flex-direction: column;
  align-items: center;
      justify-content: center;

    }
  
    .left-side img {
      max-width: 70%;
      height: auto;
    }
  
    /* Partie droite avec formulaire */
    .right-side {
      width: 50%;
      background-color: #ffffff;
      padding: 40px;
      position: relative;
    }
  
    .right-side h1 {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid silver;
    }
  
    form {
      padding: 0 20px;
      box-sizing: border-box;
    }
  
    .txt_field {
      position: relative;
      border-bottom: 2px solid #adadad;
      margin: 30px 0;
    }
  
    .txt_field input {
      width: 100%;
      padding: 0 5px;
      height: 40px;
      font-size: 16px;
      border: none;
      background: none;
      outline: none;
    }
  
    .txt_field label {
      position: absolute;
      top: 50%;
      left: 5px;
      color: #adadad;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      transition: 0.5s;
    }
  
    .txt_field span::before {
      content: '';
      position: absolute;
      top: 40px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #2691d9;
      transition: 0.5s;
    }
  
    .txt_field input:focus ~ label,
    .txt_field input:valid ~ label {
      top: -5px;
      color: #2691d9;
    }
  
    .txt_field input:focus ~ span::before,
    .txt_field input:valid ~ span::before {
      width: 100%;
    }
  
    input[type="submit"] {
      width: 100%;
      height: 50px;
      border: 1px solid;
      background: #2691d9;
      border-radius: 25px;
      font-size: 18px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
  
    input[type="submit"]:hover {
      background-color: #217ac0;
      transition: 0.3s;
    }
  
    .signup_link {
      margin: 20px 0;
      text-align: center;
      font-size: 14px;
      color: #666666;
    }
  
    .signup_link a {
      color: #2691d9;
      text-decoration: none;
    }
  
    .signup_link a:hover {
      text-decoration: underline;
    }
  
    .cancelbtn {
      background-color: #807b7b;
      border: none;
      color: white;
      padding: 10px 18px;
      margin-top: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  
    .cancelbtn:hover {
      background-color: #020346;
    }

   .error-message {
     color: red;
     font-size: 12px;
     margin-top: 5px;
   }
   .success-message {
     color: green;
     font-size: 12px;
     margin-top: 5px;
   }
  </style>
  
  <div class="modal">
    <div class="modal-content">
      <div class="left-side">
        <img class="logo" src="/assets/images/AppGard.png" alt="Logo"> 
        <img class="logo" src="/assets/images/AppGuard.png" alt="Logo">
      </div>
  
      <div class="right-side">
        <h1>Reset Password</h1>
  
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
          <div class="txt_field">
            <input type="email" formControlName="email" required>
            <span></span>
            <label>Email</label>
          </div>
  
          <div *ngIf="submitted && f['email'].errors" class="error-message">
            <small *ngIf="f['email'].errors['required']">Email is required.</small>
            <small *ngIf="f['email'].errors['email']">Format d'email invalide.</small>
          </div>
  
          <div *ngIf="successMessage" class="success-message">
            {{ successMessage }}
          </div>
  
          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>
  
          <input type="submit" value="Submit">
          <button [routerLink]="'/home'" type="button" class="cancelbtn">Cancel</button>
        </form>
      </div>
    </div>
  </div>
