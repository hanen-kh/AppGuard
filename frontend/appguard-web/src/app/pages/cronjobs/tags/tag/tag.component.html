<div class="overlay">
  <div class="modal">
    <button class="close-btn" (click)="closeForm()">✖</button>

    <h3>Create New Tag</h3>

    <div class="form-group">
      <label>Tag Name</label>
      <input type="text" [(ngModel)]="newTag.name" placeholder="Enter tag name" />
    </div>

    <div class="form-group">
      <label>Tag Type</label>
      <select [(ngModel)]="newTag.type">
        <option *ngFor="let type of ['ENVIRONMENT','CLIENT','TYPE','PRIORITY','CUSTOM']" [value]="type">{{ type }}</option>
      </select>
    </div>

    <!-- Preview -->
    <div *ngIf="newTag.name.trim()" class="preview">
      <span [ngClass]="getTagClass()">{{ newTag.name }}</span> ({{ newTag.type }})
    </div>

    <div *ngIf="message" class="message">{{ message }}</div>

    <button class="submit-btn" (click)="createTag()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating...' : 'Create Tag' }}
    </button>
  </div>
</div>


<style>
    .overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}

.modal {
  background: white; padding: 2rem; border-radius: 8px;
  width: 300px; position: relative;
}

.close-btn { position: absolute; top: 0.5rem; right: 0.5rem; border: none; background: none; cursor: pointer; }

.form-group { margin-bottom: 1rem; }

input, select { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc; }

.submit-btn { width: 100%; padding: 0.5rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }

.message { color: red; margin-bottom: 0.5rem; }

.preview {
  margin-bottom: 1rem;
}

.tag-environment { background-color: #dcfce7; color: #166534; padding: 0.2rem 0.5rem; border-radius: 9999px; }
.tag-client      { background-color: #dbeafe; color: #1e40af; padding: 0.2rem 0.5rem; border-radius: 9999px; }
.tag-type        { background-color: #f3e8ff; color: #7c2d12; padding: 0.2rem 0.5rem; border-radius: 9999px; }
.tag-priority    { background-color: #fef2f2; color: #dc2626; padding: 0.2rem 0.5rem; border-radius: 9999px; }
.tag-custom      { background-color: #f9fafb; color: #374151; padding: 0.2rem 0.5rem; border-radius: 9999px; }

</style>
